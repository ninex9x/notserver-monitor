name: Bug
description: Relate um comportamento incorreto sem incluir dados privados.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Não publique tokens, hosts privados, logs reais ou APKs configurados.
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento observado
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Use valores e dados fictícios.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Node 24, Ubuntu 24.04, Android 14
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi credenciais, endereços e dados reais deste relato.
          required: true
