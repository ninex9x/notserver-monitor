name: Melhoria
description: Sugira uma evolução para o projeto.
title: "[Melhoria]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que necessidade a mudança atende?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas
      description: Quais outras abordagens foram consideradas?
